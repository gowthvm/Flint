name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (CPython ${{ matrix.cpython }} / win_amd64)
    runs-on: windows-latest
    strategy:
      matrix:
        cpython: ['cp310', 'cp311', 'cp312', 'cp313']
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: ${{ matrix.cpython }}-win_amd64
          CIBW_ARCHS_WINDOWS: AMD64

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.cpython }}
          path: wheelhouse/*.whl

  smoke-test:
    name: Smoke test
    needs: [build-sdist, build-wheels]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Install wheel in fresh venv and smoke test
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install --find-links=dist flint-usb

          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          Write-Host "Installed version: $version"
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }

          flint --version
          if ($LASTEXITCODE -ne 0) { throw "flint --version failed" }

          Write-Host "Smoke test passed"

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true
