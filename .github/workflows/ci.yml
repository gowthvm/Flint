name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install dev deps
        run: |
          pip install -r requirements-dev.txt
      - name: Build native writer extension
        run: |
          python setup.py build_ext --inplace
      - name: Lint (config in pyproject.toml)
        run: |
          ruff check .
      - name: Type check
        run: |
          mypy core ui main.py --ignore-missing-imports
      - name: Run tests
        run: |
          python -m pytest -q

  # Proves PyInstaller still works on a normal push (the release workflow is
  # the only other place the exe gets built).
  build-exe:
    name: Build Windows exe
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # pinned to match .github/workflows/publish.yml
      - name: Install PyInstaller
        run: |
          pip install pyinstaller==6.22.0
      - name: Build native writer extension
        run: |
          python setup.py build_ext --inplace
      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm flint.spec
      - uses: actions/upload-artifact@v4
        with:
          name: flint-exe
          path: dist/flint.exe
          if-no-files-found: error
