name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build native writer extension
        run: |
          python setup.py build_ext --inplace

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm flint.spec

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: flint-dist
          path: dist/

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Flint build ${{ github.run_number }}
          body: |
            Automated build from workflow run ${{ github.run_number }}.
          draft: false
          prerelease: false

      - name: Upload EXE to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/flint.exe
          asset_name: flint.exe
          asset_content_type: application/octet-stream
