[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
extend-exclude = ["_regression.py"]

[tool.ruff.lint]
# E203: whitespace before slice punctuation (PEP-8 conflict)
# BLE001: deliberate catch-all fallback chains (worker threads, fallbacks)
# S110:  deliberate try/except-pass swallow sites
ignore = ["E203", "BLE001", "S110"]